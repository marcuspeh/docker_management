# Serves both web apps from one origin and proxies /api to the backend, so the
# browser sees a single origin and CORS stays off.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Deploy output can be large.
    client_max_body_size 4m;

    # Hashed assets are immutable, the entry documents are not.
    location /deployment/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /containers/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Deploy output and container logs stream for minutes at a time; buffering
    # would defeat the point.
    location ~ ^/api/.*logs$ {
        proxy_pass http://portal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://portal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Client-side routes fall back to each app's own index.html.
    location /deployment/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /deployment/index.html;
    }

    location /containers/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /containers/index.html;
    }

    location / {
        return 302 /deployment/;
    }
}