# Portal backend: the API that drives the host's Docker daemon.
#
# No published port: nginx in ../frontend is the only entry point, and it
# reaches this service over the shared `portal` network. There is no
# authentication in v1, so the API must not be reachable from the network.

services:
  portal:
    build:
      context: .
    # No published port: nginx is the only entry point.
    expose:
      - "8000"
    volumes:
      # Docker socket access is equivalent to root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Clones and the SQLite database. Must be the same path inside and out,
      # so relative bind mounts inside a deployed compose file resolve on the
      # host.
      - /srv/portal:/srv/portal
      # Read-only SSH keys and known_hosts for private repositories.
      - ~/.ssh:/root/.ssh:ro
    environment:
      WORKSPACE_DIR: /srv/portal/repos
      DB_URL: sqlite:////srv/portal/portal.db
      # Left unset: both apps are served from this same origin.
      # CORS_ORIGINS: https://deployment.example.com
    labels:
      # Marks this container so the portal excludes and refuses to stop itself.
      portal.self: "true"
    networks:
      - portal
    restart: unless-stopped

networks:
  # Shared with the frontend stack, where nginx proxies /api to this service.
  # It is external so neither stack owns its lifecycle: `docker compose down`
  # in either folder leaves it in place.
  portal:
    name: portal
    external: true
