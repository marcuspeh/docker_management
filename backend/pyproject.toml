[project]
name = "portal-backend"
version = "0.1.0"
description = "FastAPI service behind the SCM and Containers pages"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "docker>=7.1",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: integration test requiring a reachable Docker daemon",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]